# 1. Database Connection (XAMPP default)
spring.datasource.url=jdbc:mysql://localhost:3306/pro_link_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate/JPA Settings
# 'update' means Spring Boot will automatically update your tables if you change your Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect